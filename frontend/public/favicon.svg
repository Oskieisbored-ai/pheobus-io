<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#facc15"/>
      <stop offset="50%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1a2e"/>
      <stop offset="100%" style="stop-color:#2d2841"/>
    </linearGradient>
  </defs>
  <!-- Dark Roman background -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- Gold ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <!-- Sun rays -->
  <g fill="url(#g)" opacity="0.6">
    <rect x="48" y="8" width="4" height="10" rx="2"/>
    <rect x="48" y="82" width="4" height="10" rx="2"/>
    <rect x="8" y="48" width="10" height="4" rx="2"/>
    <rect x="82" y="48" width="10" height="4" rx="2"/>
    <rect x="20" y="18" width="4" height="10" rx="2" transform="rotate(45 22 23)"/>
    <rect x="76" y="72" width="4" height="10" rx="2" transform="rotate(45 78 77)"/>
    <rect x="76" y="18" width="4" height="10" rx="2" transform="rotate(-45 78 23)"/>
    <rect x="20" y="72" width="4" height="10" rx="2" transform="rotate(-45 22 77)"/>
  </g>
  <!-- Letter P -->
  <text x="50" y="66" font-family="Cinzel,Georgia,serif" font-size="42" font-weight="700" fill="url(#g)" text-anchor="middle">P</text>
</svg>
