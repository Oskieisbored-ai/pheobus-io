databases:
  - name: pheobus-db
    plan: free
    databaseName: pheobus
    user: pheobus

services:
  - type: web
    name: pheobus-io
    plan: free
    runtime: python
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    startCommand: "cd backend && gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pheobus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '[]'
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20.11.0"
